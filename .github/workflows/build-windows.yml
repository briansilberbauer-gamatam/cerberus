name: Build Windows

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release tag (e.g. v1.0.0). Leave empty to only upload the Actions artifact."
        required: false
        type: string
  push:
    branches: [ main ]
    tags: [ "v*" ]
    paths:
      - "Source/**"
      - "Resources/**"
      - "Tests/**"
      - "Tools/**"
      - "CMakeLists.txt"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  windows-x64:
    # windows-latest currently maps to the VS 2026 image, which does not
    # include the Visual Studio 17 2022 generator. JUCE 8.0.8 supports the
    # Visual Studio 2022 toolchain.
    runs-on: windows-2022
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build-windows -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DCERBERUS_BUILD_SCREENSHOT=OFF `
            -DCERBERUS_BUILD_HOST_TEST=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        shell: pwsh
        run: |
          cmake --build build-windows --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run DSP tests
        shell: pwsh
        run: |
          & "build-windows\CerberusTests_artefacts\Release\CerberusTests.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run VST3 host test
        shell: pwsh
        run: |
          & "build-windows\CerberusHostSmokeTest_artefacts\Release\CerberusHostSmokeTest.exe" `
            "build-windows\Cerberus_artefacts\Release\VST3\Cerberus.vst3"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package
        shell: pwsh
        run: |
          $stage = "stage"
          Remove-Item -Recurse -Force $stage -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $stage | Out-Null

          Copy-Item -Recurse -Force "build-windows\Cerberus_artefacts\Release\VST3\Cerberus.vst3" $stage
          Copy-Item -Force "build-windows\Cerberus_artefacts\Release\Standalone\Cerberus.exe" $stage
          Copy-Item -Force "README.md", "Resources\Lato-OFL.txt" $stage

          $version = (Select-String -Path "CMakeLists.txt" -Pattern 'project\(Cerberus VERSION ([0-9]+\.[0-9]+\.[0-9]+)\)').Matches[0].Groups[1].Value
          if (-not $version) { throw "Could not read the project version from CMakeLists.txt" }

          $zip = "Cerberus-Windows-x64-v$version.zip"
          Compress-Archive -Path "$stage\*" -DestinationPath $zip -Force

          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Out-File -Encoding ascii "Cerberus-Windows-x64-v$version.sha256"
          Get-Item $zip | Format-List Name, Length

      - name: Upload Windows distribution
        uses: actions/upload-artifact@v4
        with:
          name: Cerberus-Windows-x64
          path: |
            Cerberus-Windows-x64-v*.zip
            Cerberus-Windows-x64-v*.sha256
          if-no-files-found: error

  publish-windows:
    name: Publish Windows release
    needs: windows-x64
    if: ${{ github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: Cerberus-Windows-x64
          path: release-assets

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Cerberus ${{ inputs.release_tag || github.ref_name }}
          files: |
            release-assets/*.zip
            release-assets/*.sha256
          fail_on_unmatched_files: true
          overwrite_files: true
          generate_release_notes: true
          prerelease: ${{ contains(inputs.release_tag || github.ref_name, '-') }}

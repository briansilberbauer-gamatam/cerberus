name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "Source/**"
      - "Resources/**"
      - "Tests/**"
      - "Tools/**"
      - "CMakeLists.txt"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build-windows `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DCERBERUS_BUILD_SCREENSHOT=OFF `
            -DCERBERUS_BUILD_HOST_TEST=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        shell: pwsh
        run: |
          cmake --build build-windows --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run DSP tests
        shell: pwsh
        run: |
          & "build-windows\CerberusTests_artefacts\Release\CerberusTests.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run VST3 host test
        shell: pwsh
        run: |
          & "build-windows\CerberusHostSmokeTest_artefacts\Release\CerberusHostSmokeTest.exe" `
            "build-windows\Cerberus_artefacts\Release\VST3\Cerberus.vst3"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package
        shell: pwsh
        run: |
          $stage = "stage"
          Remove-Item -Recurse -Force $stage -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $stage | Out-Null

          Copy-Item -Recurse -Force "build-windows\Cerberus_artefacts\Release\VST3\Cerberus.vst3" $stage
          Copy-Item -Force "build-windows\Cerberus_artefacts\Release\Standalone\Cerberus.exe" $stage
          Copy-Item -Force "README.md", "Resources\Lato-OFL.txt" $stage

          $zip = "Cerberus-Windows-x64-v1.0.0.zip"
          Compress-Archive -Path "$stage\*" -DestinationPath $zip -Force

          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Out-File -Encoding ascii "Cerberus-Windows-x64-v1.0.0.sha256"
          Get-Item $zip | Format-List Name, Length

      - name: Upload Windows distribution
        uses: actions/upload-artifact@v4
        with:
          name: Cerberus-Windows-x64
          path: |
            Cerberus-Windows-x64-v1.0.0.zip
            Cerberus-Windows-x64-v1.0.0.sha256
          if-no-files-found: error

name: Build Plugins

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release tag (e.g. v2.0.0). Leave empty to only upload the Actions artifact."
        required: false
        type: string
  push:
    branches: [ main ]
    tags: [ "v*" ]
    paths:
      - "Source/**"
      - "Resources/**"
      - "Tests/**"
      - "Tools/**"
      - "CMakeLists.txt"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  windows-x64:
    name: Windows x64
    # windows-latest currently maps to the VS 2026 image, which does not
    # include the Visual Studio 17 2022 generator. JUCE 8.0.8 supports the
    # Visual Studio 2022 toolchain.
    runs-on: windows-2022
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build-windows -A x64 `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DCERBERUS_BUILD_SCREENSHOT=OFF `
            -DCERBERUS_BUILD_HOST_TEST=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        shell: pwsh
        run: |
          cmake --build build-windows --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run DSP tests
        shell: pwsh
        run: |
          & "build-windows\CerberusTests_artefacts\Release\CerberusTests.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run VST3 host test
        shell: pwsh
        run: |
          & "build-windows\CerberusHostSmokeTest_artefacts\Release\CerberusHostSmokeTest.exe" `
            "build-windows\Cerberus_artefacts\Release\VST3\Cerberus.vst3"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package
        shell: pwsh
        run: |
          $stage = "stage"
          Remove-Item -Recurse -Force $stage -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $stage | Out-Null

          Copy-Item -Recurse -Force "build-windows\Cerberus_artefacts\Release\VST3\Cerberus.vst3" $stage
          Copy-Item -Force "build-windows\Cerberus_artefacts\Release\Standalone\Cerberus.exe" $stage
          Copy-Item -Force "README.md", "CHANGELOG.md", "Resources\Lato-OFL.txt" $stage

          $versionMatch = Select-String -Path "CMakeLists.txt" -Pattern 'project\(\s*Cerberus\s+VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)'
          if (-not $versionMatch -or $versionMatch.Matches.Count -eq 0) { throw "Could not read the project version from CMakeLists.txt" }
          $version = $versionMatch.Matches[0].Groups[1].Value

          $zip = "Cerberus-Windows-x64-v$version.zip"
          Compress-Archive -Path "$stage\*" -DestinationPath $zip -Force

          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Out-File -Encoding ascii "Cerberus-Windows-x64-v$version.sha256"
          Get-Item $zip | Format-List Name, Length

      - name: Upload Windows distribution
        uses: actions/upload-artifact@v4
        with:
          name: Cerberus-Windows-x64
          path: |
            Cerberus-Windows-x64-v*.zip
            Cerberus-Windows-x64-v*.sha256
          if-no-files-found: error

  linux-x64:
    name: Linux x64
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config zip \
            libasound2-dev \
            libx11-dev libxext-dev libxinerama-dev libxrandr-dev libxcursor-dev \
            libxcomposite-dev libxrender-dev libxfixes-dev libxi-dev libsm-dev libice-dev \
            libx11-xcb-dev libxcb1-dev \
            libexpat1-dev zlib1g-dev libpng-dev libbrotli-dev libbz2-dev

          if apt-cache show libfreetype-dev >/dev/null 2>&1; then
            FREETYPE_PACKAGE=libfreetype-dev
          else
            FREETYPE_PACKAGE=libfreetype6-dev
          fi

          if apt-cache show libfontconfig-dev >/dev/null 2>&1; then
            FONTCONFIG_PACKAGE=libfontconfig-dev
          else
            FONTCONFIG_PACKAGE=libfontconfig1-dev
          fi

          sudo apt-get install -y --no-install-recommends "$FREETYPE_PACKAGE" "$FONTCONFIG_PACKAGE"

      - name: Configure
        run: |
          cmake -S . -B build-linux -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCERBERUS_BUILD_SCREENSHOT=OFF \
            -DCERBERUS_BUILD_HOST_TEST=ON

      - name: Build
        run: cmake --build build-linux --parallel

      - name: Run DSP tests
        run: ./build-linux/CerberusTests_artefacts/Release/CerberusTests

      - name: Run VST3 host test
        run: |
          ./build-linux/CerberusHostSmokeTest_artefacts/Release/CerberusHostSmokeTest \
            build-linux/Cerberus_artefacts/Release/VST3/Cerberus.vst3

      - name: Package Linux distribution
        run: |
          set -euo pipefail

          VERSION="$(sed -nE 's/^project\(Cerberus VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)"
          if [ -z "$VERSION" ]; then
            echo "Could not read the project version from CMakeLists.txt" >&2
            exit 1
          fi

          STAGE="stage-linux"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"

          cp -a build-linux/Cerberus_artefacts/Release/VST3/Cerberus.vst3 "$STAGE/"
          cp build-linux/Cerberus_artefacts/Release/Standalone/Cerberus "$STAGE/"
          cp README.md CHANGELOG.md Resources/Lato-OFL.txt "$STAGE/"

          strip --strip-unneeded \
            "$STAGE/Cerberus.vst3/Contents/x86_64-linux/Cerberus.so" \
            "$STAGE/Cerberus"

          ZIP="Cerberus-Linux-x64-v${VERSION}.zip"
          (cd "$STAGE" && zip -q -r "../${ZIP}" .)
          sha256sum "$ZIP" > "Cerberus-Linux-x64-v${VERSION}.sha256"

          ls -lh "$ZIP"
          cat "Cerberus-Linux-x64-v${VERSION}.sha256"

      - name: Upload Linux distribution
        uses: actions/upload-artifact@v4
        with:
          name: Cerberus-Linux-x64
          path: |
            Cerberus-Linux-x64-v*.zip
            Cerberus-Linux-x64-v*.sha256
          if-no-files-found: error

  macos-universal:
    name: macOS Universal
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Ninja
        run: brew install ninja

      - name: Configure Universal Binary (arm64 + x86_64)
        run: |
          cmake -S . -B build-macos -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="11.0" \
            -DCERBERUS_BUILD_SCREENSHOT=OFF \
            -DCERBERUS_BUILD_HOST_TEST=ON

      - name: Build
        run: cmake --build build-macos --parallel

      - name: Ad-hoc sign macOS bundles
        run: |
          set -euo pipefail
          for bundle in build-macos/Cerberus_artefacts/Release/VST3/*.vst3 \
                        build-macos/Cerberus_artefacts/Release/Standalone/*.app; do
            if [ -e "$bundle" ]; then
              codesign --force --deep --sign - "$bundle"
              codesign --verify --deep --strict "$bundle"
            fi
          done

      - name: Run DSP tests
        run: ./build-macos/CerberusTests_artefacts/Release/CerberusTests

      - name: Run VST3 host test
        run: |
          ./build-macos/CerberusHostSmokeTest_artefacts/Release/CerberusHostSmokeTest \
            build-macos/Cerberus_artefacts/Release/VST3/Cerberus.vst3

      - name: Package macOS distribution
        run: |
          set -euo pipefail

          VERSION="$(sed -nE 's/^project\(Cerberus VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)"
          if [ -z "$VERSION" ]; then
            echo "Could not read the project version from CMakeLists.txt" >&2
            exit 1
          fi

          STAGE="stage-macos"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"

          cp -R build-macos/Cerberus_artefacts/Release/VST3/Cerberus.vst3 "$STAGE/"
          cp -R build-macos/Cerberus_artefacts/Release/Standalone/Cerberus.app "$STAGE/"
          cp README.md CHANGELOG.md Resources/Lato-OFL.txt "$STAGE/"

          ZIP="Cerberus-macOS-Universal-v${VERSION}.zip"
          ditto -c -k --sequesterRsrc "$STAGE" "$ZIP"
          shasum -a 256 "$ZIP" > "Cerberus-macOS-Universal-v${VERSION}.sha256"

          ls -lh "$ZIP"
          cat "Cerberus-macOS-Universal-v${VERSION}.sha256"

      - name: Upload macOS distribution
        uses: actions/upload-artifact@v4
        with:
          name: Cerberus-macOS-Universal
          path: |
            Cerberus-macOS-Universal-v*.zip
            Cerberus-macOS-Universal-v*.sha256
          if-no-files-found: error

  publish-release:
    name: Publish release
    needs: [ windows-x64, linux-x64, macos-universal ]
    if: ${{ github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Build release notes from CHANGELOG
        run: |
          set -euo pipefail
          TAG="${{ inputs.release_tag || github.ref_name }}"
          VERSION="${TAG#v}"

          awk -v version="$VERSION" '
            index($0, "## [" version "]") == 1 { capture = 1; next }
            capture && index($0, "## [") == 1 { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "Cerberus ${TAG}" > release-notes.md
          fi

          cat release-notes.md

      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          pattern: Cerberus-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Cerberus ${{ inputs.release_tag || github.ref_name }}
          body_path: release-notes.md
          files: |
            release-assets/*.zip
            release-assets/*.sha256
          fail_on_unmatched_files: true
          overwrite_files: true
          generate_release_notes: true
          prerelease: ${{ contains(inputs.release_tag || github.ref_name, '-') }}
